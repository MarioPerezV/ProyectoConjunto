<!DOCTYPE html>

<html class="dark" lang="es">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Iniciar Sesión | DevPortfolio</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0db9f2",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101e22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .bg-grid-pattern {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
        .blur-orb {
            filter: blur(80px);
            z-index: -1;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display min-h-screen relative overflow-hidden flex flex-col items-center justify-center p-4">
    <!-- Decorative Background Elements -->
    <div class="absolute inset-0 bg-grid-pattern opacity-40"></div>
    <div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary/20 rounded-full blur-orb"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-[30%] h-[30%] bg-primary/10 rounded-full blur-orb"></div>
    <div class="w-full max-w-[440px] z-10">
        <!-- Branding -->
        <div class="flex flex-col items-center gap-2 mb-8">
            <div class="flex items-center gap-3">
                <div class="size-10 bg-primary rounded-lg flex items-center justify-center shadow-lg shadow-primary/20">
                    <svg class="text-background-dark size-7" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path clip-rule="evenodd" d="M39.475 21.6262C40.358 21.4363 40.6863 21.5589 40.7581 21.5934C40.7876 21.655 40.8547 21.857 40.8082 22.3336C40.7408 23.0255 40.4502 24.0046 39.8572 25.2301C38.6799 27.6631 36.5085 30.6631 33.5858 33.5858C30.6631 36.5085 27.6632 38.6799 25.2301 39.8572C24.0046 40.4502 23.0255 40.7407 22.3336 40.8082C21.8571 40.8547 21.6551 40.7875 21.5934 40.7581C21.5589 40.6863 21.4363 40.358 21.6262 39.475C21.8562 38.4054 22.4689 36.9657 23.5038 35.2817C24.7575 33.2417 26.5497 30.9744 28.7621 28.762C30.9744 26.5497 33.2417 24.7574 35.2817 23.5037C36.9657 22.4689 38.4054 21.8562 39.475 21.6262ZM4.41189 29.2403L18.7597 43.5881C19.8813 44.7097 21.4027 44.9179 22.7217 44.7893C24.0585 44.659 25.5148 44.1631 26.9723 43.4579C29.9052 42.0387 33.2618 39.5667 36.4142 36.4142C39.5667 33.2618 42.0387 29.9052 43.4579 26.9723C44.1631 25.5148 44.659 24.0585 44.7893 22.7217C44.9179 21.4027 44.7097 19.8813 43.5881 18.7597L29.2403 4.41187C27.8527 3.02428 25.8765 3.02573 24.2861 3.36776C22.6081 3.72863 20.7334 4.58419 18.8396 5.74801C16.4978 7.18716 13.9881 9.18353 11.5858 11.5858C9.18354 13.988 7.18717 16.4978 5.74802 18.8396C4.58421 20.7334 3.72865 22.6081 3.36778 24.2861C3.02574 25.8765 3.02429 27.8527 4.41189 29.2403Z" fill="currentColor" fill-rule="evenodd"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold tracking-tight text-white">DevPortfolio</h1>
            </div>
            <p class="text-slate-400 font-medium">Portal de Autenticación de Desarrolladores</p>
        </div>
        <!-- Login Card -->
        <div class="bg-white/5 dark:bg-[#182d34] backdrop-blur-md border border-white/10 dark:border-[#315a68] rounded-xl shadow-2xl overflow-hidden p-8">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-white mb-2">Bienvenido de Nuevo</h2>
                <p class="text-slate-400 text-sm">Inicia sesión para gestionar tu portafolio profesional.</p>
            </div>
            <form class="space-y-5" id="loginForm">
                <!-- Username/Email -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-slate-300 ml-1">Correo o Usuario</label>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary">person</span>
                        <input id="email" name="email" class="w-full bg-background-dark/50 border border-slate-700 dark:border-[#315a68] focus:border-primary focus:ring-1 focus:ring-primary/30 rounded-lg h-14 pl-12 pr-4 text-white placeholder:text-slate-500 transition-all outline-none" placeholder="Ingresa tus credenciales" required="" type="email" />
                    </div>
                </div>
                <!-- Password -->
                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center ml-1">
                        <label class="text-sm font-semibold text-slate-300">Contraseña</label>
                    </div>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary">lock</span>
                        <input id="password" name="password" class="w-full bg-background-dark/50 border border-slate-700 dark:border-[#315a68] focus:border-primary focus:ring-1 focus:ring-primary/30 rounded-lg h-14 pl-12 pr-12 text-white placeholder:text-slate-500 transition-all outline-none" placeholder="••••••••" required="" type="password" />
                        <button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition-colors" type="button">
                            <span class="material-symbols-outlined" style="font-size: 20px;">visibility</span>
                        </button>
                    </div>
                </div>
                <!-- Utilities -->
                <div class="flex items-center justify-between py-1">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <div class="relative flex items-center">
                            <input class="peer h-5 w-5 rounded border-slate-700 dark:border-[#315a68] bg-background-dark text-primary focus:ring-primary focus:ring-offset-background-dark" type="checkbox" />
                        </div>
                        <span class="text-sm text-slate-400 group-hover:text-slate-300 transition-colors">Recuérdame</span>
                    </label>
                    <a class="text-sm font-medium text-primary hover:text-primary/80 transition-colors" href="#">¿Olvidaste tu contraseña?</a>
                </div>
                <!-- Submit -->
                <button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold text-base h-14 rounded-lg shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-all active:scale-[0.98]" type="submit">
                    <span>Iniciar Sesión</span>
                    <span class="material-symbols-outlined">login</span>
                </button>
                <div id="error-message" class="text-red-500 text-sm text-center mt-2 font-medium" style="display: none;"></div>
            </form>
            <div class="mt-8 pt-6 border-t border-white/5 text-center">
                <p class="text-slate-400 text-sm">
                    ¿No tienes una cuenta?
                    <a class="text-primary font-bold hover:underline underline-offset-4 ml-1" href="#">Regístrate</a>
                </p>
            </div>
        </div>
        <!-- Footer Info -->
        <div class="mt-8 flex items-center justify-center gap-6 text-slate-500 text-xs uppercase tracking-widest font-semibold">
            <a class="hover:text-primary transition-colors" href="#">Política de Privacidad</a>
            <span class="size-1 rounded-full bg-slate-700"></span>
            <a class="hover:text-primary transition-colors" href="#">Términos de Servicio</a>
            <span class="size-1 rounded-full bg-slate-700"></span>
            <a class="hover:text-primary transition-colors" href="#">Soporte</a>
        </div>
    </div>
    <!-- Optional Visual: Status Indicator -->
    <div class="fixed bottom-6 right-6 hidden md:flex items-center gap-3 bg-white/5 backdrop-blur px-4 py-2 rounded-full border border-white/10">
        <div class="size-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(34,197,94,0.6)]"></div>
        <span class="text-xs font-medium text-slate-400">Todos los Sistemas Operativos</span>
    </div>
    <script src="auth.js"></script>
</body>
</html>
