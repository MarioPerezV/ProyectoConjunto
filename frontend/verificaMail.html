<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Verificar Código - DevPortfolio</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#0db9f2",
                "background-light": "#f5f8f8",
                "background-dark": "#101e22",
              },
              fontFamily: {
                "display": ["Inter"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
    <style>
        .grid-background {
            background-image: 
                linear-gradient(to right, rgba(13, 185, 242, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(13, 185, 242, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .radial-glow {
            background: radial-gradient(circle at 50% 50%, rgba(13, 185, 242, 0.15) 0%, transparent 70%);
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col overflow-x-hidden">
    <!-- Background Decoration -->
    <div class="fixed inset-0 grid-background pointer-events-none"></div>
    <div class="fixed inset-0 radial-glow pointer-events-none"></div>
    <!-- Header / Branding -->
    <header class="relative z-10 w-full px-8 py-6 flex justify-center lg:justify-start">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-primary rounded flex items-center justify-center">
                <span class="material-icons text-white text-xl">code</span>
            </div>
            <span class="text-xl font-bold tracking-tight text-slate-800 dark:text-white uppercase">DevPortfolio</span>
        </div>
    </header>
    <!-- Main Content -->
    <main class="relative z-10 flex-grow flex items-center justify-center px-4 py-12">
        <div class="relative w-full max-w-md">
            <!-- Elegant Plant Icon Decoration -->
            <div class="absolute -top-12 -right-12 opacity-20 dark:opacity-30 pointer-events-none">
                <span class="material-icons text-8xl text-primary">eco</span>
            </div>
            <!-- Verification Card -->
            <div class="bg-white dark:bg-slate-900/80 backdrop-blur-xl border border-slate-200 dark:border-primary/20 rounded-xl shadow-2xl p-8 lg:p-10 relative overflow-hidden">
                <div class="text-center mb-10">
                    <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-3 tracking-tight">Verificar Código</h1>
                    <p class="text-slate-500 dark:text-slate-400">Hemos enviado un código de 6 dígitos a tu correo</p>
                </div>
                <!-- OTP Form -->
                <form class="space-y-8">
                    <div class="flex justify-between gap-2 sm:gap-4">
                        <input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-lg bg-slate-50 dark:bg-background-dark border-2 border-slate-200 dark:border-primary/20 text-primary focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" maxlength="1" placeholder="·" type="text"/>
                        <input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-lg bg-slate-50 dark:bg-background-dark border-2 border-slate-200 dark:border-primary/20 text-primary focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" maxlength="1" placeholder="·" type="text"/>
                        <input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-lg bg-slate-50 dark:bg-background-dark border-2 border-slate-200 dark:border-primary/20 text-primary focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" maxlength="1" placeholder="·" type="text"/>
                        <input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-lg bg-slate-50 dark:bg-background-dark border-2 border-slate-200 dark:border-primary/20 text-primary focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" maxlength="1" placeholder="·" type="text"/>
                        <input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-lg bg-slate-50 dark:bg-background-dark border-2 border-slate-200 dark:border-primary/20 text-primary focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" maxlength="1" placeholder="·" type="text"/>
                        <input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-lg bg-slate-50 dark:bg-background-dark border-2 border-slate-200 dark:border-primary/20 text-primary focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" maxlength="1" placeholder="·" type="text"/>
                    </div>
                    <button class="w-full py-4 bg-primary hover:bg-primary/90 text-white font-semibold rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center space-x-2 group" type="submit">
                        <span>Verificar</span>
                        <span class="material-icons text-lg group-hover:translate-x-1 transition-transform">arrow_forward</span>
                    </button>
                </form>
                <div class="mt-8 text-center">
                    <p class="text-slate-500 dark:text-slate-400">
                        ¿No recibiste el código? 
                        <a class="text-primary hover:text-primary/80 font-medium transition-colors ml-1" href="#">Reenviar</a>
                    </p>
                </div>
                <!-- Subtle Decorative Pattern in Card -->
                <div class="absolute -bottom-6 -left-6 opacity-5">
                    <span class="material-icons text-9xl text-primary">apps</span>
                </div>
            </div>
            <!-- Support Links under Card -->
            <div class="mt-8 flex justify-center space-x-6 text-sm text-slate-500 dark:text-slate-500">
                <a class="hover:text-primary transition-colors" href="#">Soporte</a>
                <span class="opacity-30">•</span>
                <a class="hover:text-primary transition-colors" href="#">Seguridad</a>
                <span class="opacity-30">•</span>
                <a class="hover:text-primary transition-colors" href="#">Ayuda</a>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <footer class="relative z-10 w-full py-8 px-8 border-t border-slate-200 dark:border-primary/10">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center text-sm text-slate-500 dark:text-slate-500 space-y-4 md:space-y-0">
            <p>© 2024 DevPortfolio. Todos los derechos reservados.</p>
            <div class="flex space-x-8">
                <a class="hover:text-primary transition-colors" href="#">Privacidad</a>
                <a class="hover:text-primary transition-colors" href="#">Términos de Servicio</a>
                <a class="hover:text-primary transition-colors" href="#">Cookies</a>
            </div>
        </div>
    </footer>
</body>
</html>
