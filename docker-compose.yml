services:
  # MySQL Database for the PHP part
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: mariope1_agencia
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: mariope1_gaby
      MYSQL_PASSWORD: 2025pLR8aUBkhM
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # PHP Application (Frontend + Legacy Views)
  php-app:
    build:
      context: .
      dockerfile: php.Dockerfile
    container_name: php-app
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    env_file:
      - app/.env
    depends_on:
      - db

  # Python FastAPI Backend
  python-backend:
    build:
      context: ./backend
      dockerfile: python.Dockerfile
    container_name: python-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./app.db
      - SECRET_KEY=change-this-to-a-random-secret-key
      - JWT_ALGORITHM=HS256
      - CORS_ORIGINS_RAW=http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      - db

volumes:
  db_data:
